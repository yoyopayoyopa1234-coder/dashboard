name: update-data
on:
  schedule:
    - cron: "17 */3 * * *"   # 3시간마다
  workflow_dispatch:
  push:
    paths: ["scripts/**", ".github/workflows/update-data.yml"]
permissions:
  contents: write
  issues: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install websocket-client==1.8.0
      - run: python scripts/fetch_data.py
      - run: python scripts/alerts.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python scripts/generate_report.py
      - name: commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data.json report.html alerts.json alerts_state.json
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u +%F' '%H:%M)"
          for i in 1 2 3 4; do git push && break; git pull --rebase -X theirs || { git rebase --abort; git pull --no-rebase -X ours; }; sleep 3; done

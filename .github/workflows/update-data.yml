name: update-data
on:
  schedule:
    - cron: "17 */3 * * *"   # 3시간마다
  workflow_dispatch:
  push:
    paths: ["scripts/**", ".github/workflows/update-data.yml"]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/fetch_data.py
      - run: python scripts/generate_report.py
      - name: commit data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add data.json report.html
          git diff --cached --quiet || (git commit -m "data: $(date -u +%F' '%H:%M)" && git push)

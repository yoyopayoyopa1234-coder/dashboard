name: capture-tradingview
on:
  schedule:
    - cron: "40 21 * * 1-5"   # 미국 장 마감 후 (한국 06:40)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.47.0 && python -m playwright install --with-deps chromium
      - run: python scripts/verify_tv.py
        env:
          TV_SESSIONID: ${{ secrets.TV_SESSIONID }}
          TV_SESSIONID_SIGN: ${{ secrets.TV_SESSIONID_SIGN }}
      - name: commit captures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add verify_summary.json
          git diff --cached --quiet || (git commit -m "captures: $(date -u +%F' '%H:%M)" && git pull --rebase && git push)

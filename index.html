<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MSTR · TQQQ 데일리</title>
<style>
  :root { --bg:#0f1216; --panel:#171b21; --line:#262c35; --fg:#e6e9ee; --muted:#8a93a3; --accent:#f0b429; color-scheme:dark; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--fg); font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  .wrap { padding:12px 12px 40px; max-width:1100px; margin:0 auto; }
  header { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  h1 { font-size:18px; margin:0; }
  .date { color:var(--muted); font-size:12px; }
  .btn { font:inherit; font-size:12px; padding:5px 10px; border-radius:6px; border:1px solid var(--line); background:var(--panel); color:var(--fg); cursor:pointer; }
  .btn[aria-pressed="true"] { border-color:var(--accent); color:var(--accent); }
  header .btn { margin-left:auto; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:8px; margin-bottom:14px; overflow:hidden; }
  .panel h2 { margin:0; padding:9px 12px; font-size:14px; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; border-bottom:1px solid var(--line); }
  .panel h2 .sym { color:var(--accent); }
  .panel h2 .desc { color:var(--muted); font-weight:400; font-size:12px; }
  .panel h2 .tools { margin-left:auto; display:flex; gap:4px; align-items:center; font-weight:400; font-size:12px; color:var(--muted); }
  .sum { padding:8px 12px; font-size:13px; font-variant-numeric:tabular-nums; border-bottom:1px solid var(--line); line-height:1.6; }
  .sum b { font-weight:600; }
  .up { color:#e5484d; } .dn { color:#3b82f6; } .on { color:#5ad445; font-weight:600; }
  .plot { width:100%; }
  .status { font-size:12px; color:var(--muted); padding:6px 12px; }
  .err { color:#e5484d; }
  input[type=range] { width:90px; vertical-align:middle; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>MSTR · TQQQ 데일리</h1>
    <span class="date" id="today"></span>
    <button class="btn" id="refresh" type="button">새로고침</button>
  </header>

  <div class="panel">
    <h2><span class="sym">TQQQ</span><span class="desc">월봉 · BB 20/2 · Williams Vix Fix</span></h2>
    <div class="sum" id="sum-a">불러오는 중…</div>
    <div class="plot" id="plot-a" style="height:620px"></div>
  </div>

  <div class="panel">
    <h2><span class="sym" id="m2sym">MSTR</span><span class="desc">주봉 · Global M2</span>
      <span class="tools">
        <button class="btn" data-m2="MSTR" aria-pressed="true" type="button">MSTR</button>
        <button class="btn" data-m2="NDX" aria-pressed="false" type="button">NDX</button>
        오프셋 <input type="range" id="m2off" min="0" max="120" value="0"> <span id="m2offv">0</span>일
      </span></h2>
    <div class="sum" id="sum-b">불러오는 중…</div>
    <div class="plot" id="plot-b" style="height:480px"></div>
  </div>

  <div class="panel">
    <h2><span class="sym">MSTR</span><span class="desc">월봉 · RSI 14 · Williams Vix Fix</span></h2>
    <div class="sum" id="sum-c">불러오는 중…</div>
    <div class="plot" id="plot-c" style="height:700px"></div>
  </div>

  <div class="status">데이터: Yahoo Finance · FRED (Global M2 = 미국+유로존+중국+일본 M2, 달러 환산). 하루 1회 캐시, 새로고침 버튼으로 강제 갱신.</div>
</div>

<script>
const $ = s => document.querySelector(s);
const store = { get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }, set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
const todayKey = new Date().toISOString().slice(0,10);
$('#today').textContent = new Date().toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'});

/* ── 데이터 ── */
const PROXIES = [
  u => 'https://corsproxy.io/?url=' + encodeURIComponent(u),
  u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
  u => 'https://api.codetabs.com/v1/proxy/?quest=' + encodeURIComponent(u),
];
async function pfetch(u){ let last; for(const p of PROXIES){ try{ const r=await fetch(p(u)); if(r.ok) return r; last=new Error('HTTP '+r.status); }catch(e){ last=e; } } throw last||new Error('데이터 서버 연결 실패'); }

async function ohlc(sym, iv){
  const ck=`o:${sym}:${iv}:${todayKey}`, c=store.get(ck); if(c) return c.map(d=>({...d,t:new Date(d.t)}));
  const r = await pfetch(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(sym)}?range=max&interval=${iv}`);
  const res = (await r.json()).chart.result[0], q = res.indicators.quote[0], out=[];
  res.timestamp.forEach((t,i)=>{ if(q.close[i]!=null) out.push({t:new Date(t*1000),o:q.open[i],h:q.high[i],l:q.low[i],c:q.close[i]}); });
  if(out.length<10) throw new Error(sym+' 데이터 부족');
  store.set(ck,out); return out;
}
async function fred(id){
  const txt = await (await pfetch(`https://fred.stlouisfed.org/graph/fredgraph.csv?id=${id}`)).text(), out=[];
  txt.trim().split('\n').slice(1).forEach(l=>{ const [d,v]=l.split(','); if(v && v.trim()!=='.') out.push({t:d.slice(0,7), v:+v}); });
  if(!out.length) throw new Error(id); return out;
}
async function globalM2(){
  const ck=`m2:${todayKey}`, c=store.get(ck); if(c) return c;
  const parts = [
    { id:'M2SL',          mul:1e9 },                  // US, 십억달러
    { id:'MYAGM2EZM196N', mul:1e6, fx:'EXUSEU' },     // 유로존 EUR → ×USD/EUR
    { id:'MYAGM2CNM189N', mul:1,   fx:'EXCHUS', inv:1 }, // 중국 CNY → ÷CNY/USD
    { id:'MYAGM2JPM189N', mul:1,   fx:'EXJPUS', inv:1 }, // 일본 JPY → ÷JPY/USD
  ];
  const series = await Promise.all(parts.map(async p=>{ try{
      const m=await fred(p.id), f=p.fx?new Map((await fred(p.fx)).map(d=>[d.t,d.v])):null; let last=null; const o=new Map();
      m.forEach(d=>{ let r=1; if(f){ r=f.get(d.t)??last; if(r==null) return; last=r; } o.set(d.t, d.v*p.mul*(p.inv?1/r:r)); });
      return o; }catch(e){ return null; } }));
  const ok = series.filter(Boolean); if(!ok.length) throw new Error('FRED 연결 실패');
  // 모든 국가 값이 있는 달만 합산
  const months=[...ok[0].keys()].filter(k=>ok.every(s=>s.has(k))).sort();
  const rows=months.map(k=>({t:k+'-01', v:ok.reduce((a,s)=>a+s.get(k),0)/1e12}));
  const out={rows, n:ok.length}; store.set(ck,out); return out;
}

/* ── 지표 ── */
const sma=(a,n)=>a.map((_,i)=> i<n-1?null: a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n);
const sd=(a,n)=>a.map((_,i)=>{ if(i<n-1) return null; const s=a.slice(i-n+1,i+1), m=s.reduce((x,y)=>x+y,0)/n; return Math.sqrt(s.reduce((x,y)=>x+(y-m)**2,0)/n); });
const hi=(a,n)=>a.map((_,i)=> Math.max(...a.slice(Math.max(0,i-n+1),i+1)));
function bb(c,n=20,k=2){ const m=sma(c,n), s=sd(c,n); return {mid:m, up:m.map((v,i)=>v==null?null:v+k*s[i]), lo:m.map((v,i)=>v==null?null:v-k*s[i])}; }
function rsi(c,n=14){ const o=[null]; let g=0,l=0; for(let i=1;i<c.length;i++){ const d=c[i]-c[i-1], u=Math.max(d,0), w=Math.max(-d,0);
  if(i<=n){ g+=u; l+=w; if(i<n){o.push(null);continue;} g/=n; l/=n; } else { g=(g*(n-1)+u)/n; l=(l*(n-1)+w)/n; } o.push(l===0?100:100-100/(1+g/l)); } return o; }
/* CM_Williams_Vix_Fix 22 20 2 50 0.85 1.01 */
function vixfix(rows, pd=22, bbl=20, mult=2, lb=50, ph=0.85){
  const c=rows.map(r=>r.c), hc=hi(c,pd), w=rows.map((r,i)=>(hc[i]-r.l)/hc[i]*100);
  const m=sma(w,bbl), s=sd(w,bbl), up=m.map((v,i)=>v==null?null:v+mult*s[i]), rh=hi(w,lb).map(v=>v*ph);
  return { w, up, rh, sig:w.map((v,i)=> v>=rh[i] || (up[i]!=null && v>=up[i])) };
}

/* ── 그리기 ── */
const C = { grid:'#262c35', txt:'#c9cfd8', up:'#e5484d', dn:'#3b82f6' };
const base = h => ({ paper_bgcolor:'rgba(0,0,0,0)', plot_bgcolor:'rgba(0,0,0,0)', font:{color:C.txt,size:11}, height:h,
  margin:{l:8,r:56,t:10,b:28}, showlegend:false, hovermode:'x unified', dragmode:'pan', xaxis:{rangeslider:{visible:false}, gridcolor:C.grid} });
const ax = o => ({ gridcolor:C.grid, zeroline:false, side:'right', tickfont:{size:10}, ...o });
const candle = r => ({ type:'candlestick', x:r.map(d=>d.t), open:r.map(d=>d.o), high:r.map(d=>d.h), low:r.map(d=>d.l), close:r.map(d=>d.c),
  increasing:{line:{color:C.up},fillcolor:C.up}, decreasing:{line:{color:C.dn},fillcolor:C.dn}, name:'가격' });
const line = (x,y,color,name,extra={}) => ({ x, y, name, mode:'lines', line:{color,width:1.4}, ...extra });
const vixTraces = (x,v,yaxis) => [
  { type:'bar', x, y:v.w, name:'Vix Fix', marker:{color:v.sig.map(b=>b?'#5ad445':'#e05a5a')}, yaxis },
  line(x, v.rh, '#f0a030', 'RangeHigh', { yaxis, line:{color:'#f0a030',width:2.5} }),
];
const cfg = { responsive:true, displaylogo:false, scrollZoom:true, modeBarButtonsToRemove:['lasso2d','select2d','autoScale2d'] };
const pct = (a,b) => { const p=(a/b-1)*100; return `<span class="${p>=0?'up':'dn'}">${p>=0?'+':''}${p.toFixed(2)}%</span>`; };
const fmt = v => v.toLocaleString('en-US',{maximumFractionDigits:2});

async function chartA(){
  const r = await ohlc('TQQQ','1mo'), x=r.map(d=>d.t), c=r.map(d=>d.c), b=bb(c), v=vixfix(r), i=r.length-1;
  const pb=(c[i]-b.lo[i])/(b.up[i]-b.lo[i]);
  $('#sum-a').innerHTML = `<b>${fmt(c[i])}</b> ${pct(c[i],c[i-1])} (이번 달) · BB 상단 ${fmt(b.up[i])} / 중심 ${fmt(b.mid[i])} / 하단 ${fmt(b.lo[i])} · %b ${pb.toFixed(2)} · Vix Fix ${v.w[i].toFixed(1)} ${v.sig[i]?'<span class="on">신호 ON</span>':'꺼짐'}`;
  const L = base(620); L.yaxis=ax({domain:[0.38,1], type:'log'}); L.yaxis2=ax({domain:[0,0.33]});
  Plotly.react('plot-a', [ candle(r),
    line(x,b.up,'#e5484d','BB 상단',{line:{color:'#e5484d',width:1}}), line(x,b.mid,'#4f7cf7','BB 중심',{line:{color:'#4f7cf7',width:1}}),
    line(x,b.lo,'#2bb58f','BB 하단',{line:{color:'#2bb58f',width:1}, fill:'tonexty', fillcolor:'rgba(79,124,247,0.07)'}),
    ...vixTraces(x,v,'y2') ], L, cfg);
}

let M2=null, m2sym='MSTR';
async function chartB(){
  const ysym = m2sym==='NDX' ? '^NDX' : 'MSTR';
  const r = await ohlc(ysym,'1wk'), x=r.map(d=>d.t), c=r.map(d=>d.c), i=r.length-1;
  const L = base(480); L.yaxis=ax({type: m2sym==='MSTR'?'log':'linear'}); L.yaxis2=ax({overlaying:'y', side:'left', showgrid:false, title:{text:'M2 $조',font:{size:10}}});
  const back = Math.max(0, r.length-260); L.xaxis.range=[x[back], new Date(x[i].getTime()+20*86400000)];
  const tr=[candle(r)];
  let m2txt = 'Global M2 불러오는 중…';
  if(M2 && M2.rows.length){
    const off=+$('#m2off').value, mx=M2.rows.map(d=>new Date(new Date(d.t).getTime()+off*86400000)), last=M2.rows[M2.rows.length-1], prev=M2.rows[M2.rows.length-2];
    tr.push(line(mx, M2.rows.map(d=>d.v), '#2e9d4a', 'Global M2', {yaxis:'y2', line:{color:'#2e9d4a',width:2.5}}));
    m2txt = `Global M2 <b>$${last.v.toFixed(1)}조</b> ${pct(last.v,prev.v)} (${last.t.slice(0,7)} 전월비${M2.n<4?`, ${M2.n}개국`:''})`;
  } else if(M2===false) m2txt = '<span class="err">Global M2 불러오기 실패</span>';
  $('#sum-b').innerHTML = `${m2sym} <b>${fmt(c[i])}</b> ${pct(c[i],c[i-1])} (이번 주) · ${m2txt}`;
  Plotly.react('plot-b', tr, L, cfg);
}

async function chartC(){
  const r = await ohlc('MSTR','1mo'), x=r.map(d=>d.t), c=r.map(d=>d.c), rs=rsi(c), v=vixfix(r), i=r.length-1;
  $('#sum-c').innerHTML = `<b>${fmt(c[i])}</b> ${pct(c[i],c[i-1])} (이번 달) · RSI ${rs[i].toFixed(1)}${rs[i]>=70?' 과매수':rs[i]<=30?' 과매도':''} · Vix Fix ${v.w[i].toFixed(1)} ${v.sig[i]?'<span class="on">신호 ON</span>':'꺼짐'}`;
  const L = base(700); L.yaxis=ax({domain:[0.52,1], type:'log'}); L.yaxis2=ax({domain:[0.27,0.48], range:[0,100]}); L.yaxis3=ax({domain:[0,0.23]});
  const back=Math.max(0,r.length-60); L.xaxis.range=[x[back], new Date(x[i].getTime()+40*86400000)];
  L.shapes=[ {type:'rect',xref:'paper',x0:0,x1:1,yref:'y2',y0:30,y1:70,fillcolor:'rgba(120,110,230,0.10)',line:{width:0}},
    ...[30,50,70].map(y=>({type:'line',xref:'paper',x0:0,x1:1,yref:'y2',y0:y,y1:y,line:{color:'#5d6675',width:0.8,dash:'dot'}})) ];
  Plotly.react('plot-c', [ candle(r), line(x,rs,'#7c7cf0','RSI 14',{yaxis:'y2', line:{color:'#7c7cf0',width:1.8}}), ...vixTraces(x,v,'y3') ], L, cfg);
}

function safe(fn, id){ return fn().catch(e=>{ $(id).innerHTML=`<span class="err">오류: ${e.message} — 새로고침을 눌러주세요.</span>`; }); }
async function init(){
  safe(chartA,'#sum-a'); safe(chartC,'#sum-c');
  await safe(chartB,'#sum-b');
  try{ M2 = await globalM2(); }catch(e){ M2 = false; }
  safe(chartB,'#sum-b');
}

document.querySelectorAll('[data-m2]').forEach(b=>b.addEventListener('click',()=>{
  m2sym=b.dataset.m2; $('#m2sym').textContent=m2sym;
  document.querySelectorAll('[data-m2]').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); safe(chartB,'#sum-b'); }));
$('#m2off').addEventListener('input',e=>{ $('#m2offv').textContent=e.target.value; safe(chartB,'#sum-b'); });
$('#refresh').addEventListener('click',()=>{ try{ Object.keys(localStorage).filter(k=>/^(o|m2):/.test(k)).forEach(k=>localStorage.removeItem(k)); }catch(e){} M2=null; init(); });

const PLOTLY_SRC = [
  'https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js',
  'https://unpkg.com/plotly.js-dist-min@2.35.2/plotly.min.js',
  'https://cdn.plot.ly/plotly-2.35.2.min.js',
];
const loadScript = src => new Promise((ok,no)=>{ const s=document.createElement('script'); s.src=src; s.onload=ok; s.onerror=no; document.head.appendChild(s); });
(async()=>{
  for(const src of PLOTLY_SRC){ try{ await loadScript(src); if(window.Plotly) break; }catch(e){} }
  if(!window.Plotly){ ['#sum-a','#sum-b','#sum-c'].forEach(id=>$(id).innerHTML='<span class="err">차트 라이브러리를 불러오지 못했습니다. 새로고침하세요.</span>'); return; }
  init();
})();
</script>
</body>
</html>
